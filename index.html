<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b16">
  <title>FAI AI — Your Personal AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>FAI AI</strong><small>V2.0 PERSONAL ASSISTANT</small></div>
      </div>
      <button class="new-chat" id="newChatBtn">＋ New chat</button>
      <div class="side-label">RECENT CHATS</div>
      <div id="historyList" class="history-list"></div>
      <div class="sidebar-bottom">
        <div class="status-dot"></div><span id="connectionLabel">AI connection not tested</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="top-title"><span class="online-dot"></span> FAI AI <span class="version">V2.0</span></div>
        <button class="icon-btn" id="clearBtn" title="Clear current chat" aria-label="Clear chat">⌫</button>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-orb"><span>F</span></div>
          <p class="eyebrow">YOUR PERSONAL AI ASSISTANT</p>
          <h1>Assalam-o-Alaikum!<br><span>How can I help you?</span></h1>
          <p class="welcome-copy">Ask anything, learn something new, write, code, or upload an image.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Mujhe HTML aur CSS Roman Urdu mein step by step sikhao.">📘 Learn coding</button>
            <button class="suggestion" data-prompt="Mere liye ek professional daily study plan banao.">🗓 Make a plan</button>
            <button class="suggestion" data-prompt="Mujhe ek professional business poster ka text likh kar do.">✍️ Write something</button>
            <button class="suggestion" data-prompt="AI kya hoti hai? Asaan Roman Urdu mein samjhao.">💡 Explain AI</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </section>

      <div class="composer-wrap">
        <div id="imagePreview" class="image-preview hidden"></div>
        <form id="chatForm" class="composer">
          <input id="imageInput" type="file" accept="image/*" hidden>
          <button type="button" class="tool-btn" id="uploadBtn" title="Upload image" aria-label="Upload image">＋</button>
          <textarea id="messageInput" rows="1" placeholder="Message FAI AI..." aria-label="Message FAI AI"></textarea>
          <button type="button" class="tool-btn mic-btn" id="micBtn" title="Voice input" aria-label="Voice input">🎙</button>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">➤</button>
        </form>
        <div class="composer-note">FAI AI can make mistakes. Check important information.</div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
